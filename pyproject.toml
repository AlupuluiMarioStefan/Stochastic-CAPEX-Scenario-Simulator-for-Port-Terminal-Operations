[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "terminalsim"
version = "1.0.0"
description = "SimPy discrete-event simulation of a container terminal: queues, opening hours, inspections, investment analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["simpy>=4.0"]
keywords = ["simulation", "discrete-event", "simpy", "operations-research", "port", "logistics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]
dev = ["pytest>=7", "matplotlib>=3.5"]

[project.scripts]
terminalsim = "terminalsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
